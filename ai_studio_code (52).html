<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#060407">
    <title>Happy Birthday Maryam ✨</title>

    <!-- Google Fonts: Cormorant Garamond (Luxury Serif) & Montserrat (Refined Modern Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <!-- Preload Critical Media -->
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/markthomas7878078-png/Wishing-files/main/image%201.jpg">
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/markthomas7878078-png/Wishing-files/main/image%202.jpg">
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/markthomas7878078-png/Wishing-files/main/image%203.jpg">
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/markthomas7878078-png/Wishing-files/main/mix%20image.png">

    <style>
        /* ==========================================================================
           1. CSS RESET & GLOBAL THEME
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep-black: #050406;
            --bg-charcoal: #0e090e;
            --burgundy: #4a0d24;
            --dark-plum: #28081f;
            --gold: #dfba73;
            --gold-light: #f7e2a9;
            --gold-glow: rgba(223, 186, 115, 0.45);
            --gold-soft-border: rgba(223, 186, 115, 0.35);
            --blush: rgba(214, 108, 143, 0.18);
            --white-soft: #fbf8f5;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            --ease-cinematic: cubic-bezier(0.25, 1, 0.5, 1);
        }

        html, body {
            width: 100%;
            max-width: 100%;
            min-height: 100svh;
            overflow-x: hidden;
            background-color: var(--bg-deep-black);
            color: var(--white-soft);
            font-family: var(--font-sans);
            line-height: 1.6;
            touch-action: manipulation;
        }

        /* Ambient Layered Cinematic Background */
        .ambient-canvas-wrapper {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background:
                radial-gradient(circle at 18% 22%, rgba(120, 25, 60, 0.28), transparent 42%),
                radial-gradient(circle at 82% 78%, rgba(223, 186, 115, 0.14), transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(55, 10, 42, 0.2), transparent 60%),
                linear-gradient(145deg, #040305 0%, #100812 50%, #060408 100%);
        }

        #particleCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.85;
        }

        /* Subtle Light Leaks & Vignette */
        .vignette-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            box-shadow: inset 0 0 110px rgba(0, 0, 0, 0.85);
        }

        /* ==========================================================================
           2. VIEW CONTAINER & SCENE ARCHITECTURE
           ========================================================================== */
        #experience-stage {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 100%;
            min-height: 100svh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scene {
            position: absolute;
            inset: 0;
            width: 100%;
            min-height: 100svh;
            padding: clamp(20px, 4vh, 48px) clamp(16px, 5vw, 40px);
            padding-top: calc(clamp(20px, 4vh, 48px) + env(safe-area-inset-top));
            padding-bottom: calc(clamp(24px, 5vh, 52px) + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.985) translateY(12px);
            transition: opacity 0.85s var(--ease-cinematic),
                        transform 0.85s var(--ease-cinematic),
                        visibility 0.85s var(--ease-cinematic);
            pointer-events: none;
        }

        .scene.active {
            position: relative;
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* ==========================================================================
           3. LUXURY BUTTONS & TYPOGRAPHY
           ========================================================================== */
        .btn-luxury {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(18, 10, 16, 0.65);
            color: var(--gold-light);
            font-family: var(--font-sans);
            font-size: clamp(14px, 3.8vw, 16px);
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 34px;
            min-height: 52px;
            border-radius: 999px;
            border: 1px solid var(--gold-soft-border);
            cursor: pointer;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 16px rgba(223, 186, 115, 0.12);
            transition: all 0.4s var(--ease-cinematic);
            margin-top: clamp(16px, 3vh, 28px);
            text-decoration: none;
            user-select: none;
            touch-action: manipulation;
        }

        .btn-luxury:hover, .btn-luxury:active {
            background: rgba(35, 15, 28, 0.85);
            border-color: var(--gold-light);
            color: #ffffff;
            box-shadow: 0 10px 38px rgba(0, 0, 0, 0.65), 0 0 28px var(--gold-glow);
            transform: translateY(-2px);
        }

        .scene-heading {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(26px, 6.8vw, 48px);
            color: var(--gold-light);
            text-align: center;
            text-shadow: 0 0 25px rgba(223, 186, 115, 0.35);
            letter-spacing: 0.5px;
            line-height: 1.25;
            margin-bottom: 12px;
        }

        .scene-subheading {
            font-size: clamp(13px, 3.4vw, 16px);
            font-weight: 300;
            color: rgba(251, 248, 245, 0.75);
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 8px;
        }

        /* ==========================================================================
           PAGE 1 — GRAND INTRO
           ========================================================================== */
        #scene-intro {
            text-align: center;
            max-width: 720px;
            margin: 0 auto;
        }

        .intro-ornament {
            font-size: 20px;
            color: var(--gold);
            margin-bottom: 18px;
            letter-spacing: 8px;
            opacity: 0.8;
            animation: pulseSoft 3s ease-in-out infinite;
        }

        .intro-title-primary {
            font-family: var(--font-serif);
            font-size: clamp(22px, 5.2vw, 36px);
            font-style: italic;
            color: rgba(247, 226, 169, 0.88);
            font-weight: 300;
            margin-bottom: 14px;
            line-height: 1.35;
        }

        .intro-title-hero {
            font-family: var(--font-serif);
            font-size: clamp(38px, 9.8vw, 72px);
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #ffffff 15%, var(--gold-light) 65%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 35px rgba(223, 186, 115, 0.28);
            letter-spacing: 1.5px;
            line-height: 1.15;
            margin-bottom: 24px;
        }

        /* ==========================================================================
           PAGE 2 — BIRTHDAY CAKE & INTERACTION
           ========================================================================== */
        #scene-cake {
            text-align: center;
            gap: 12px;
        }

        .cake-stage-container {
            position: relative;
            width: min(84vw, 340px);
            height: clamp(240px, 34vh, 320px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
        }

        /* Pure CSS Luxury Cake Presentation */
        .cake-wrapper {
            position: relative;
            width: 220px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            transition: transform 0.6s var(--ease-cinematic);
        }

        .cake-wrapper.cut-activated {
            animation: cakeCelebrate 1.2s ease forwards;
        }

        .cake-plate {
            width: 250px;
            height: 14px;
            background: linear-gradient(90deg, #3a2d1d, #deb872, #fff7d6, #deb872, #3a2d1d);
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(223, 186, 115, 0.3);
            margin-top: -6px;
        }

        .cake-tier {
            position: relative;
            border-radius: 12px 12px 6px 6px;
            box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.4), 0 10px 22px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .cake-tier-bottom {
            width: 190px;
            height: 75px;
            background: linear-gradient(135deg, #3d0e22 0%, #68153c 60%, #2f091a 100%);
            border: 1px solid rgba(223, 186, 115, 0.28);
        }

        .cake-tier-top {
            width: 135px;
            height: 65px;
            background: linear-gradient(135deg, #471129 0%, #7d1a49 60%, #350c1e 100%);
            border: 1px solid rgba(223, 186, 115, 0.32);
            margin-bottom: -4px;
            z-index: 2;
        }

        .cake-icing {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 18px;
            background: #fdf5ea;
            border-radius: 10px 10px 20px 20px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
        }

        .cake-trim {
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
        }

        /* Candles */
        .candles-row {
            position: absolute;
            top: 22px;
            z-index: 3;
            display: flex;
            gap: 22px;
        }

        .candle {
            position: relative;
            width: 8px;
            height: 38px;
            background: repeating-linear-gradient(45deg, #fff7d9, #fff7d9 4px, #deb872 4px, #deb872 8px);
            border-radius: 4px;
        }

        .wick {
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 8px;
            background: #2b2216;
        }

        .flame {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 13px;
            height: 20px;
            background: radial-gradient(circle at 50% 80%, #ff8c00, #ffd700 60%, #ffffff 90%);
            border-radius: 50% 50% 35% 35% / 60% 60% 40% 40%;
            filter: drop-shadow(0 0 8px #ffb300);
            animation: flameFlicker 1.4s ease-in-out infinite alternate;
        }

        .flame:nth-child(2) {
            animation-delay: 0.3s;
        }

        /* Knife element */
        .knife {
            position: absolute;
            top: -40px;
            right: -20px;
            width: 90px;
            height: 22px;
            opacity: 0;
            pointer-events: none;
            transform-origin: right center;
            transform: rotate(-35deg);
            z-index: 10;
            filter: drop-shadow(0 5px 12px rgba(0,0,0,0.6));
            transition: all 0.5s ease;
        }

        .knife-blade {
            position: absolute;
            left: 0;
            width: 60px;
            height: 14px;
            background: linear-gradient(90deg, #ffffff, #cfcfcf);
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
            border-radius: 2px;
        }

        .knife-handle {
            position: absolute;
            right: 0;
            width: 32px;
            height: 12px;
            background: linear-gradient(90deg, #512015, #220804);
            border-radius: 3px;
            border: 1px solid var(--gold);
        }

        /* Knife Cut Motion */
        .cutting-active .knife {
            opacity: 1;
            animation: knifeSlice 1.3s cubic-bezier(0.45, 0, 0.25, 1) forwards;
        }

        /* Cake Cut Seam Reaction */
        .cut-seam {
            position: absolute;
            top: 0;
            left: 50%;
            width: 3px;
            height: 0;
            background: rgba(255, 230, 180, 0.95);
            box-shadow: 0 0 12px var(--gold-light);
            z-index: 5;
            transition: height 0.6s ease;
            transform: translateX(-50%);
        }

        .cutting-active .cut-seam {
            height: 100%;
        }

        /* Celebration sparkles container */
        .cake-sparkles-burst {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: visible;
        }

        /* ==========================================================================
           PAGES 3, 4, 5 — 9:16 PORTRAIT LUXURY MEMORY ALBUMS
           ========================================================================== */
        .memory-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
        }

        .memory-header {
            margin-bottom: clamp(10px, 1.8vh, 18px);
            text-align: center;
        }

        /* 9:16 Strict Aspect Ratio Luxury Frame */
        .album-frame-container {
            position: relative;
            /* Mobile dominant size while fitting in safe-view */
            width: min(84vw, 360px);
            aspect-ratio: 9 / 16;
            margin: 0 auto;
            border-radius: 18px;
            padding: clamp(9px, 2.4vw, 15px);
            background:
                linear-gradient(135deg, rgba(223, 186, 115, 0.45), rgba(70, 18, 38, 0.35) 45%, rgba(223, 186, 115, 0.35));
            box-shadow:
                0 22px 60px rgba(0, 0, 0, 0.85),
                0 0 35px rgba(223, 186, 115, 0.22),
                inset 0 1px 2px rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .album-inner-border {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: #090509;
            overflow: hidden;
            border: 1px solid rgba(223, 186, 115, 0.45);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CRITICAL REQUIREMENT: 9:16 OBJECT FIT CONTAIN, NEVER COVER */
        .album-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
            border-radius: 10px;
            transition: transform 0.8s var(--ease-cinematic);
            user-select: none;
            -webkit-user-drag: none;
        }

        .album-glass-sheen {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(130deg, rgba(255,255,255,0.12) 0%, transparent 40%, rgba(223,186,115,0.06) 100%);
            border-radius: 10px;
        }

        @media (min-height: 800px) and (min-width: 600px) {
            .album-frame-container {
                width: auto;
                height: min(68vh, 660px);
                aspect-ratio: 9 / 16;
            }
        }

        /* ==========================================================================
           PAGE 6 — MAGICAL ARCHED MIRROR
           ========================================================================== */
        #scene-mirror {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .mirror-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
        }

        /* Authentic Arched Silhouette */
        .mirror-silhouette-frame {
            position: relative;
            width: min(84vw, 360px);
            height: clamp(380px, 58vh, 520px);
            /* Arched crown top and softly curved base */
            border-radius: 180px 180px 32px 32px / 160px 160px 24px 24px;
            padding: clamp(9px, 2.4vw, 14px);
            background: linear-gradient(150deg, #d3ab64 0%, #290d1c 45%, #e8c683 80%, #59253d 100%);
            box-shadow:
                0 25px 70px rgba(0,0,0,0.9),
                0 0 25px rgba(223, 186, 115, 0.2);
            transition: all 1.2s var(--ease-cinematic);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        .mirror-silhouette-frame.mirror-active {
            box-shadow:
                0 25px 85px rgba(0, 0, 0, 0.95),
                0 0 65px var(--gold-glow),
                0 0 100px rgba(180, 50, 100, 0.35);
            border-color: #ffe8b5;
        }

        .mirror-glass-chamber {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 172px 172px 24px 24px / 152px 152px 18px 18px;
            background: radial-gradient(circle at 50% 35%, #180d19 0%, #080408 85%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(223, 186, 115, 0.35);
            transition: background 1.2s ease, border-color 1.2s ease;
        }

        .mirror-active .mirror-glass-chamber {
            background: radial-gradient(circle at 50% 30%, #3d142d 0%, #150614 75%);
            border-color: rgba(247, 226, 169, 0.7);
        }

        /* Maryam Image Inside Mirror Silhouette */
        .mirror-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            opacity: 0;
            filter: blur(8px) brightness(0.6);
            transform: scale(0.95);
            transition: opacity 1.8s ease, filter 1.8s ease, transform 1.8s var(--ease-cinematic);
            z-index: 2;
            pointer-events: none;
            user-select: none;
        }

        .mirror-active .mirror-image {
            opacity: 1;
            filter: blur(0px) brightness(1.05);
            transform: scale(1);
        }

        /* Glass Surface Reflection & Shimmer */
        .mirror-shimmer {
            position: absolute;
            inset: 0;
            background: linear-gradient(125deg, rgba(255,255,255,0.2) 0%, transparent 45%, rgba(223, 186, 115, 0.15) 100%);
            opacity: 0.4;
            pointer-events: none;
            z-index: 3;
            transition: opacity 1.2s ease;
        }

        .mirror-active .mirror-shimmer {
            opacity: 0.18;
        }

        .mirror-inner-lights {
            position: absolute;
            inset: -5px;
            border-radius: inherit;
            border: 2px solid transparent;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .mirror-active .mirror-inner-lights {
            opacity: 1;
            box-shadow: inset 0 0 35px var(--gold-glow);
        }

        @media (min-width: 768px) {
            .mirror-silhouette-frame {
                width: min(52vw, 420px);
                height: min(68vh, 620px);
            }
        }

        /* ==========================================================================
           PAGE 7 — PERSONAL BIRTHDAY MESSAGE (WORD-BY-WORD ANIMATION)
           ========================================================================== */
        #scene-message {
            text-align: center;
            max-width: 740px;
            margin: 0 auto;
            justify-content: center;
        }

        .message-box {
            position: relative;
            width: 100%;
            padding: clamp(24px, 5vh, 46px) clamp(18px, 4.5vw, 42px);
            background: rgba(18, 9, 16, 0.6);
            border-radius: 24px;
            border: 1px solid rgba(223, 186, 115, 0.28);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(120, 25, 60, 0.2);
        }

        .message-content {
            font-family: var(--font-serif);
            font-size: clamp(18px, 4vw, 27px);
            line-height: 1.75;
            color: rgba(255, 255, 255, 0.94);
            letter-spacing: 0.4px;
            text-align: center;
        }

        .word-token {
            display: inline-block;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.45s ease, transform 0.45s ease, filter 0.45s ease;
            filter: blur(3px);
            margin: 0 2.5px;
        }

        .word-token.visible {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        .word-token.highlight-name {
            color: var(--gold-light);
            font-weight: 600;
            text-shadow: 0 0 16px var(--gold-glow);
        }

        /* ==========================================================================
           PAGE 8 — FINAL CINEMATIC SCENE & BLACKOUT
           ========================================================================== */
        #scene-final {
            text-align: center;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .final-title {
            font-family: var(--font-serif);
            font-size: clamp(34px, 8.8vw, 76px);
            color: var(--gold-light);
            font-weight: 400;
            letter-spacing: 1px;
            text-shadow: 0 0 35px rgba(223, 186, 115, 0.45);
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 2.2s ease, transform 2.2s ease;
        }

        .final-title.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Complete blackout screen overlay */
        #pure-blackout {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 3.5s ease;
        }

        #pure-blackout.fade-in {
            opacity: 1;
            pointer-events: auto;
        }

        /* ==========================================================================
           KEYFRAME ANIMATIONS
           ========================================================================== */
        @keyframes flameFlicker {
            0% { transform: translateX(-50%) scale(1) rotate(-1deg); }
            50% { transform: translateX(-50%) scale(1.08, 0.95) rotate(2deg); }
            100% { transform: translateX(-50%) scale(0.94, 1.05) rotate(-2deg); }
        }

        @keyframes knifeSlice {
            0% { opacity: 0; transform: translate(30px, -40px) rotate(-35deg); }
            35% { opacity: 1; transform: translate(0px, 0px) rotate(-22deg); }
            65% { transform: translate(-30px, 45px) rotate(-10deg); }
            100% { opacity: 0; transform: translate(-45px, 80px) rotate(0deg); }
        }

        @keyframes cakeCelebrate {
            0% { transform: scale(1); }
            30% { transform: scale(1.04); }
            60% { transform: scale(0.98); }
            100% { transform: scale(1); }
        }

        @keyframes pulseSoft {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.08); }
        }

        /* Reduced Motion Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Visual Canvas Layers -->
    <div class="ambient-canvas-wrapper">
        <canvas id="particleCanvas"></canvas>
    </div>
    <div class="vignette-overlay"></div>

    <!-- Hidden Native Audio Node (Controlled exclusively via audioManager) -->

    <!-- Ultimate Fade-to-Black Overlay -->

    <!-- ==========================================================================
       JAVASCRIPT ARCHITECTURE
       ========================================================================== -->
    <script>
        (function() {
            'use strict';

            /* ======================================================================
               AUDIO ENGINE (Robust, centralized, fail-safe audio manager)
               ====================================================================== */
            const TRACK_URLS = {
                INTRO: "https://raw.githubusercontent.com/markthomas7878078-png/Wishing-files/main/%F0%9F%A5%80Happy%20Birthday%20Wishes%20%F0%9F%A5%80%20Happy%20Birthday%20whatsapp%20status%20%F0%9F%8E%89%20happy%20birthday%20status%20%F0%9F%A5%B3%20birthday%20status%20%F0%9F%8E%82.mp3",
                MEMORIES: "https://raw.githubusercontent.com/markthomas7878078-png/Wishing-files/main/Maroon%205%20-%20Memories%20(Lyrics).mp3",
                EMOTIONAL: "https://raw.githubusercontent.com/markthomas7878078-png/Wishing-files/main/Most%20Emotional%20Music%20Ever_%20Nightsky%20%20Tracey%20Chattaway.mp3"
            };

            const audioManager = {
                audioElement: document.getElementById('coreAudio'),
                currentTrackKey: null,
                isPendingPlay: false,
                fadeInterval: null,
                audioContext: null,

                init() {
                    this.audioElement.volume = 1;
                    this.audioElement.addEventListener('error', (e) => {
                        console.error('Audio failed to load/play:', this.audioElement.src, e);
                    });
                    this.audioElement.addEventListener('playing', () => {
                        console.log('Audio playing successfully:', this.audioElement.src);
                    });

                    // First global gesture interaction fallback unlocker
                    const handleFirstUserGesture = () => {
                        if (this.isPendingPlay && this.currentTrackKey) {
                            console.log('Autoplay restriction resolved by user interaction.');
                            this.playTrack(this.currentTrackKey, false);
                        }
                        window.removeEventListener('pointerdown', handleFirstUserGesture);
                        window.removeEventListener('keydown', handleFirstUserGesture);
                    };
                    window.addEventListener('pointerdown', handleFirstUserGesture, { once: true });
                    window.addEventListener('keydown', handleFirstUserGesture, { once: true });
                },

                playTrack(trackKey, preservePositionIfSame = true) {
                    if (preservePositionIfSame && this.currentTrackKey === trackKey && !this.audioElement.paused) {
                        console.log('Audio track already active and continuing seamlessly:', trackKey);
                        return;
                    }

                    const targetUrl = TRACK_URLS[trackKey];
                    if (!targetUrl) {
                        console.warn('Track URL requested does not exist in registry:', trackKey);
                        return;
                    }

                    this.currentTrackKey = trackKey;
                    clearInterval(this.fadeInterval);
                    this.audioElement.volume = 1;

                    if (this.audioElement.src !== targetUrl) {
                        this.audioElement.src = targetUrl;
                        this.audioElement.load();
                        console.log('Audio loading:', targetUrl);
                    }

                    const playPromise = this.audioElement.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            this.isPendingPlay = false;
                        }).catch((err) => {
                            console.warn('Autoplay prevented by browser policy. Queued for first touch:', err);
                            this.isPendingPlay = true;
                        });
                    }
                },

                fadeOut(durationMs = 3000, onComplete = null) {
                    clearInterval(this.fadeInterval);
                    const stepTime = 50;
                    const steps = durationMs / stepTime;
                    const volumeStep = this.audioElement.volume / steps;

                    this.fadeInterval = setInterval(() => {
                        if (this.audioElement.volume > volumeStep) {
                            this.audioElement.volume = Math.max(0, this.audioElement.volume - volumeStep);
                        } else {
                            this.audioElement.volume = 0;
                            this.audioElement.pause();
                            clearInterval(this.fadeInterval);
                            if (typeof onComplete === 'function') onComplete();
                        }
                    }, stepTime);
                },

                // Web Audio API harmonic chime for Cake cut ceremony (Guarantees zero-network audio feedback)
                playCelebrationChime() {
                    try {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (!AudioCtx) return;
                        if (!this.audioContext) this.audioContext = new AudioCtx();
                        if (this.audioContext.state === 'suspended') this.audioContext.resume();

                        const now = this.audioContext.currentTime;
                        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 (Uplifting chord)

                        notes.forEach((freq, idx) => {
                            const osc = this.audioContext.createOscillator();
                            const gain = this.audioContext.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, now + (idx * 0.12));

                            gain.gain.setValueAtTime(0.0001, now + (idx * 0.12));
                            gain.gain.exponentialRampToValueAtTime(0.25, now + (idx * 0.12) + 0.04);
                            gain.gain.exponentialRampToValueAtTime(0.0001, now + (idx * 0.12) + 1.8);

                            osc.connect(gain);
                            gain.connect(this.audioContext.destination);

                            osc.start(now + (idx * 0.12));
                            osc.stop(now + (idx * 0.12) + 2.0);
                        });
                    } catch (e) {
                        console.log('Web Audio celebratory chime skipped:', e);
                    }
                }
            };

            audioManager.init();

            /* ======================================================================
               CANVAS PARTICLE SYSTEM (Cinematic, lightweight, battery-efficient)
               ====================================================================== */
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let animationFrameId;
            let particlesActive = true;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor() {
                    this.reset(true);
                }
                reset(initial = false) {
                    this.x = Math.random() * canvas.width;
                    this.y = initial ? Math.random() * canvas.height : canvas.height + 15;
                    this.radius = Math.random() * 2.2 + 0.7;
                    this.speedY = Math.random() * 0.45 + 0.18;
                    this.speedX = (Math.random() - 0.5) * 0.28;
                    this.opacity = Math.random() * 0.55 + 0.2;
                    this.colorType = Math.random() > 0.35 ? 'gold' : 'blush';
                    this.pulseSpeed = Math.random() * 0.02 + 0.01;
                    this.pulseCounter = Math.random() * Math.PI;
                }
                update() {
                    this.y -= this.speedY;
                    this.x += this.speedX;
                    this.pulseCounter += this.pulseSpeed;
                    if (this.y < -20 || this.x < -20 || this.x > canvas.width + 20) {
                        this.reset();
                    }
                }
                draw() {
                    const dynamicAlpha = this.opacity * (0.8 + 0.2 * Math.sin(this.pulseCounter));
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    if (this.colorType === 'gold') {
                        ctx.fillStyle = `rgba(223, 186, 115, ${dynamicAlpha})`;
                        ctx.shadowColor = 'rgba(223, 186, 115, 0.4)';
                    } else {
                        ctx.fillStyle = `rgba(220, 110, 150, ${dynamicAlpha})`;
                        ctx.shadowColor = 'rgba(220, 110, 150, 0.35)';
                    }
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            const particleCount = window.innerWidth < 600 ? 32 : 65;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }

            function animateParticles() {
                if (!particlesActive) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                animationFrameId = requestAnimationFrame(animateParticles);
            }
            animateParticles();

            /* ======================================================================
               CAKE SPARKLES & CONFETTI MINI-ENGINE
               ====================================================================== */
            const cakeSparkleCanvas = document.getElementById('cakeSparkleCanvas');
            const cakeSparkleCtx = cakeSparkleCanvas.getContext('2d');
            let cakeParticles = [];
            let cakeSparkleAnimationId;

            function triggerCakeBurst() {
                cakeSparkleCanvas.width = cakeSparkleCanvas.offsetWidth;
                cakeSparkleCanvas.height = cakeSparkleCanvas.offsetHeight;
                const centerX = cakeSparkleCanvas.width / 2;
                const centerY = cakeSparkleCanvas.height / 2;

                for (let i = 0; i < 75; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4.5 + 1.2;
                    cakeParticles.push({
                        x: centerX,
                        y: centerY,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 1.2,
                        size: Math.random() * 3.5 + 1.5,
                        color: Math.random() > 0.4 ? '#fce4a6' : '#d85d85',
                        alpha: 1,
                        decay: Math.random() * 0.016 + 0.012
                    });
                }

                function renderBurst() {
                    cakeSparkleCtx.clearRect(0, 0, cakeSparkleCanvas.width, cakeSparkleCanvas.height);
                    let activeCount = 0;

                    for (let p of cakeParticles) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.08; // subtle gravity
                        p.alpha -= p.decay;

                        if (p.alpha > 0) {
                            activeCount++;
                            cakeSparkleCtx.save();
                            cakeSparkleCtx.globalAlpha = Math.max(0, p.alpha);
                            cakeSparkleCtx.fillStyle = p.color;
                            cakeSparkleCtx.beginPath();
                            cakeSparkleCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            cakeSparkleCtx.fill();
                            cakeSparkleCtx.restore();
                        }
                    }

                    if (activeCount > 0) {
                        cakeSparkleAnimationId = requestAnimationFrame(renderBurst);
                    } else {
                        cakeSparkleCtx.clearRect(0, 0, cakeSparkleCanvas.width, cakeSparkleCanvas.height);
                        cakeParticles = [];
                    }
                }
                renderBurst();
            }

            /* ======================================================================
               SCENE TRANSITION CONTROLLER
               ====================================================================== */
            const scenes = {
                intro: document.getElementById('scene-intro'),
                cake: document.getElementById('scene-cake'),
                mem1: document.getElementById('scene-memory-1'),
                mem2: document.getElementById('scene-memory-2'),
                mem3: document.getElementById('scene-memory-3'),
                mirror: document.getElementById('scene-mirror'),
                message: document.getElementById('scene-message'),
                final: document.getElementById('scene-final')
            };

            function navigateScene(hideSceneEl, showSceneEl, onTransitionComplete = null) {
                hideSceneEl.classList.remove('active');
                setTimeout(() => {
                    showSceneEl.classList.add('active');
                    if (typeof onTransitionComplete === 'function') {
                        onTransitionComplete();
                    }
                }, 400);
            }

            /* ======================================================================
               PAGE LOGIC & INTERACTIONS
               ====================================================================== */

            // PAGE 1: Try autoplay immediately
            window.addEventListener('load', () => {
                audioManager.playTrack('INTRO');
            });

            // Page 1 -> Page 2: Continue
            document.getElementById('btn-intro-continue').addEventListener('click', () => {
                // Ensure audio is running
                audioManager.playTrack('INTRO');
                navigateScene(scenes.intro, scenes.cake);
            });

            // PAGE 2: Cake Cut Interaction
            let cakeHasBeenCut = false;
            const btnCutCake = document.getElementById('btn-cut-cake');
            const btnCakeToMemories = document.getElementById('btn-cake-to-memories');
            const cakeGraphic = document.getElementById('cakeGraphic');
            const cakeStage = document.getElementById('cakeStage');

            btnCutCake.addEventListener('click', () => {
                if (cakeHasBeenCut) return;
                cakeHasBeenCut = true;

                cakeStage.classList.add('cutting-active');
                cakeGraphic.classList.add('cut-activated');

                // Trigger celebratory audio and sparkles
                setTimeout(() => {
                    audioManager.playCelebrationChime();
                    triggerCakeBurst();
                }, 600);

                // Reveal next button gracefully
                setTimeout(() => {
                    btnCutCake.style.display = 'none';
                    btnCakeToMemories.style.display = 'inline-flex';
                }, 1400);
            });

            // Page 2 -> Page 3 (Memory Album 1)
            btnCakeToMemories.addEventListener('click', () => {
                // Audio Transition: Switch to MEMORIES (Maroon 5)
                audioManager.playTrack('MEMORIES');
                navigateScene(scenes.cake, scenes.mem1);
            });

            // Page 3 -> Page 4 (Memory Album 2)
            document.getElementById('btn-memory-1-next').addEventListener('click', () => {
                // DO NOT RESTART MUSIC: Memory music continues
                audioManager.playTrack('MEMORIES', true);
                navigateScene(scenes.mem1, scenes.mem2);
            });

            // Page 4 -> Page 5 (Memory Album 3)
            document.getElementById('btn-memory-2-next').addEventListener('click', () => {
                // DO NOT RESTART MUSIC: Memory music continues
                audioManager.playTrack('MEMORIES', true);
                navigateScene(scenes.mem2, scenes.mem3);
            });

            // Page 5 -> Page 6 (Magical Mirror)
            document.getElementById('btn-memory-3-next').addEventListener('click', () => {
                // Switch smoothly to Emotional Music
                audioManager.playTrack('EMOTIONAL');
                navigateScene(scenes.mem3, scenes.mirror);
            });

            // PAGE 6: Mirror Activation
            const btnMirrorToggle = document.getElementById('btn-mirror-toggle');
            const btnMirrorContinue = document.getElementById('btn-mirror-continue');
            const mirrorFrame = document.getElementById('mirrorFrame');
            let mirrorActivated = false;

            btnMirrorToggle.addEventListener('click', () => {
                if (mirrorActivated) return;
                mirrorActivated = true;

                mirrorFrame.classList.add('mirror-active');
                btnMirrorToggle.style.display = 'none';

                setTimeout(() => {
                    btnMirrorContinue.style.display = 'inline-flex';
                }, 1600);
            });

            // Page 6 -> Page 7 (Personal Message)
            const birthdayMessageRaw = "Maryam, on your special day, I hope your life is filled with beautiful moments, genuine smiles, peaceful days, and countless reasons to be happy. You have a beautiful presence that makes ordinary moments feel a little more special, and today is simply a reminder of how wonderful you are. May this new chapter bring you unforgettable memories, bright opportunities, and all the happiness you truly deserve. Keep smiling, keep shining, and always stay beautifully yourself. Happy Birthday, Maryam.";

            btnMirrorContinue.addEventListener('click', () => {
                // DO NOT RESTART: Emotional music continues
                audioManager.playTrack('EMOTIONAL', true);

                navigateScene(scenes.mirror, scenes.message, () => {
                    startWordByWordReveal();
                });
            });

            // PAGE 7: Word-By-Word Animation System
            function startWordByWordReveal() {
                const messageContainer = document.getElementById('messageContainer');
                const btnMsgContinue = document.getElementById('btn-message-continue');
                messageContainer.innerHTML = '';

                const words = birthdayMessageRaw.split(' ');
                words.forEach((word) => {
                    const span = document.createElement('span');
                    span.className = 'word-token';
                    if (word.includes('Maryam')) {
                        span.classList.add('highlight-name');
                    }
                    span.textContent = word + ' ';
                    messageContainer.appendChild(span);
                });

                const wordElements = messageContainer.querySelectorAll('.word-token');
                let wordIndex = 0;
                const typingInterval = setInterval(() => {
                    if (wordIndex < wordElements.length) {
                        wordElements[wordIndex].classList.add('visible');
                        wordIndex++;
                    } else {
                        clearInterval(typingInterval);
                        setTimeout(() => {
                            btnMsgContinue.style.opacity = '1';
                            btnMsgContinue.style.pointerEvents = 'auto';
                        }, 700);
                    }
                }, 160); // Elegant, readable cadence
            }

            // Page 7 -> Page 8 (Final Scene & Blackout)
            document.getElementById('btn-message-continue').addEventListener('click', () => {
                // Emotional music continues
                audioManager.playTrack('EMOTIONAL', true);

                navigateScene(scenes.message, scenes.final, () => {
                    const finalHeroTitle = document.getElementById('finalHeroTitle');
                    const blackoutOverlay = document.getElementById('pure-blackout');

                    // 1. Reveal Final Typography
                    setTimeout(() => {
                        finalHeroTitle.classList.add('show');
                    }, 500);

                    // 2. Climax hold, then initiate complete fade to black & music fadeout
                    setTimeout(() => {
                        // Fade out emotional music smoothly over 4.5 seconds
                        audioManager.fadeOut(4500, () => {
                            console.log('Audio finished and dissolved.');
                        });

                        // Slowly dissolve golden particles
                        particlesActive = false;

                        // Blackout screen descends
                        blackoutOverlay.classList.add('fade-in');
                    }, 6500);
                });
            });

        })();
    </script>
